name: Release

# Push a tag such as v0.2.0 to build the Linux packages and attach them, with the update manifest, to a
# draft GitHub release. Publish the draft to make it the version the app offers to update to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build the Bible database
        run: |
          npm run data:fetch
          npm run data:build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true" # linuxdeploy's bundled strip can't read newer libraries
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "KJV Reader's Bible ${{ github.ref_name }}"
          releaseBody: "Install the AppImage or the .deb. Installed copies offer this version as an update once it is published."
          releaseDraft: true
          prerelease: false
